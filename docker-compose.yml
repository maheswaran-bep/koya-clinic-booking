services:
  clinic:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_KEY: ${API_KEY}
    container_name: koya-clinic
    ports:
      - "8010:8000"
    environment:
      DATABASE_URL: sqlite:////data/clinic.db
      API_KEY: ${API_KEY}
    volumes:
      - clinic-data:/data
    restart: unless-stopped

volumes:
  clinic-data:
